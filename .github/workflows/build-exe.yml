name: Build e Release Executável Windows

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ] # Dispara publicação de Release ao criar tags como v1.0.0
  workflow_dispatch:

permissions:
  contents: write # Necessário para o Actions criar a Release e anexar o .exe

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Gerar ClassificadorNCM.exe
        run: |
          pyinstaller --noconfirm --onefile --add-data "static;static" --hidden-import="pymysql" --hidden-import="psycopg2" --collect-all="sqlalchemy" --name="ClassificadorNCM" main.py

      - name: Publicar executável como Artefato do Build
        uses: actions/upload-artifact@v4
        with:
          name: ClassificadorNCM-Windows
          path: dist/ClassificadorNCM.exe
          retention-days: 30

      - name: Criar Release no GitHub (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClassificadorNCM.exe
          generate_release_notes: true
